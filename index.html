class Sfx {
  constructor(){this.c=null;this.m=null;this.bg=null;this.off=false}
  init(){if(this.c)return;this.c=new(window.AudioContext||window.webkitAudioContext)();this.m=this.c.createGain();this.m.gain.value=0.25;this.m.connect(this.c.destination)}
  o(f,tp,d,v=0.1,dl=0){if(!this.c||this.off)return;try{const t=this.c.currentTime;const o=this.c.createOscillator();const g=this.c.createGain();o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(0,t+dl);g.gain.linearRampToValueAtTime(v,t+dl+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dl+d);o.connect(g).connect(this.m);o.start(t+dl);o.stop(t+dl+d)}catch(e){}}
  play(t,p={}){switch(t){
    case"tap":this.o(800+(p.combo||0)*30,"sine",0.07,0.1);break;
    case"combo":[300,500,700].forEach((f,i)=>this.o(f+(p.level||1)*80,"square",0.1,0.05,i*0.04));break;
    case"coin":[1200,1600,2000].forEach((f,i)=>this.o(f,"sine",0.13,0.07,i*0.05));break;
    case"ok":[523,659,784,1047].forEach((f,i)=>this.o(f,"sine",0.25,0.08,i*0.09));break;
    case"ng":[300,250,200].forEach((f,i)=>this.o(f,"sawtooth",0.18,0.05,i*0.09));break;
    case"up":[523,659,784,880,1047,1319,1568].forEach((f,i)=>this.o(f,i<4?"sine":"triangle",0.45,0.07,i*0.07));break;
    case"rl":this.o(600+Math.random()*400,"sine",0.04,0.04);break;
    case"buy":this.o(880,"sine",0.12,0.07);this.o(660,"sine",0.12,0.07,0.07);break;
    case"pf":[523,659,784,1047,1319].forEach((f,i)=>this.o(f,"sine",0.35,0.08,i*0.06));break;
    case"wr":this.o(200,"sawtooth",0.2,0.05);break;
  }}
  bgm(id){if(!this.c||this.off)return;this.stopBgm();try{const f=[55,65,73,82,55,65,73,82,55,65,73,82][id%12];const o1=this.c.createOscillator();const o2=this.c.createOscillator();const g=this.c.createGain();const fl=this.c.createBiquadFilter();o1.type="sine";o1.frequency.value=f;o2.type="sine";o2.frequency.value=f*1.5;fl.type="lowpass";fl.frequency.value=180;g.gain.value=0.03;o1.connect(fl).connect(g).connect(this.m);o2.connect(fl);o1.start();o2.start();this.bg={o1,o2}}catch(e){}}
  stopBgm(){try{this.bg?.o1?.stop();this.bg?.o2?.stop()}catch(e){}this.bg=null}
  toggle(){this.off=!this.off;if(this.off)this.stopBgm();return this.off}
}

      {slimN && <path d="M48.5,38 Q50,39 51.5,38" fill="none" stroke="#e0c0b0" strokeWidth="0.4" opacity="0.5"/>}

      {/* Mouth — plump lips vs thin */}
      {lush ? (<g>
        {/* Upper lip — cupid's bow */}
        <path d={`M${50-5*lipScale},41 Q${50-2*lipScale},${39.5-lipScale} 50,${40-lipScale*0.5} Q${50+2*lipScale},${39.5-lipScale} ${50+5*lipScale},41`} fill="#e06070" opacity="0.7"/>

        {/* Lip shine */}

        {/* Lip outline */}

        <path d={`M${50-5*lipScale},41 Q50,${41+4*lipScale} ${50+5*lipScale},41`} fill="none" stroke="#c05060" strokeWidth="0.4"/>

      {/* White teeth flash */}
      {teeth && <path d="M48,41 Q50,41.8 52,41" fill="#fff" opacity="0.3"/>}

      {/* Bangs overlay */}
      {renderBangs()}

      {/* Earrings */}
      {s.id >= 2 && (<g>
        <circle cx={50-jw+1} cy="38" r="1.5" fill={ac} opacity="0.5"/>
        <circle cx={50+jw-1} cy="38" r="1.5" fill={ac} opacity="0.5"/>
        {s.id >= 5 && <g>
          <line x1={50-jw+1} y1="39.5" x2={50-jw+1} y2="42" stroke={ac} strokeWidth="0.5" opacity="0.5"/>
          <line x1={50+jw-1} y1="39.5" x2={50+jw-1} y2="42" stroke={ac} strokeWidth="0.5" opacity="0.5"/>

      {/* Necklace */}
      {s.id >= 3 && (<g>
        <path d={`M${50-jw+4},44 Q50,48 ${50+jw-4},44`} fill="none" stroke={ac} strokeWidth="0.8" opacity="0.5"/>

      {/* Body enhancement — chest */}
      {chest && <g>
        <ellipse cx="44" cy="56" rx="5" ry="3" fill={skin} opacity="0.3"/>
        <ellipse cx="56" cy="56" rx="5" ry="3" fill={skin} opacity="0.3"/>

      {/* Sparkle for glamour — scales with beauty */}
      {glamour > 30 && <text x="78" y="18" fontSize={4+beautyLevel*3} fill={ac} opacity={0.3+beautyLevel*0.3}>✧</text>}

        <text x="80" y="42" fontSize="3" fill={ac} opacity="0.3">✧</text>
        <text x="12" y="50" fontSize="2.5" fill={ac} opacity="0.25">✦</text>
      </g>}
      {full && <g opacity="0.5">
        <text x="8" y="16" fontSize="5" fill="#ffd700">✦</text>
        <text x="84" y="34" fontSize="4" fill="#ffd700">✧</text>
        <text x="20" y="68" fontSize="3" fill="#ffd700">✦</text>
        <text x="76" y="60" fontSize="3.5" fill="#ffd700">✧</text>
      </g>}
      {/* Skin glow overlay */}
      {glow && <ellipse cx="50" cy="50" rx="30" ry="45" fill="#fff" opacity="0.03"/>}
    </svg>
  );
};

// ─── UI COMPONENTS (compact) ─────────────────────────────────
const Particles=({color,type})=>{const p=useMemo(()=>Array.from({length:type==="s"?16:9},(_,i)=>({id:i,x:Math.random()*100,y:Math.random()*100,s:type==="s"?2+Math.random()*3:6+Math.random()*12,d:4+Math.random()*6,dl:Math.random()*5,o:type==="s"?.2+Math.random()*.4:.04+Math.random()*.07})),[color,type]);return(<div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0,overflow:"hidden"}}>{p.map(q=><div key={q.id} style={{position:"absolute",left:`${q.x}%`,top:`${q.y}%`,width:`${q.s}px`,height:`${q.s}px`,borderRadius:"50%",opacity:q.o,background:type==="s"?color:`radial-gradient(circle,${color}40,transparent 70%)`,animation:`pf ${q.d}s ease-in-out ${q.dl}s infinite alternate`}}/>)}</div>)};
const SBar=({l,v,max,c,e,r})=>(<div style={{marginBottom:"4px"}}><div style={{display:"flex",justifyContent:"space-between",fontSize:"10px",color:"#999",marginBottom:"1px"}}><span>{e} {l}</span><span><span style={{color:r!==undefined&&v>=r?"#22c55e":c,fontWeight:700}}>{Math.min(v,max)}</span><span style={{color:"#444"}}>/{max}</span>{r!==undefined&&<span style={{color:"#444",marginLeft:"3px"}}>(要{r})</span>}</span></div><div style={{height:"5px",background:"#0a0a12",borderRadius:"3px",overflow:"hidden",position:"relative"}}><div style={{height:"100%",borderRadius:"3px",transition:"width .6s cubic-bezier(.4,0,.2,1)",width:`${Math.min(v/max*100,100)}%`,background:`linear-gradient(90deg,${c}55,${c})`,boxShadow:`0 0 6px ${c}33`}}/>{r!==undefined&&<div style={{position:"absolute",top:0,bottom:0,left:`${r/max*100}%`,width:"2px",background:v>=r?"#22c55e55":"#ef444455"}}/>}</div></div>);
const EvtPop=({ev,onC})=>(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}} onClick={onC}><div style={{background:"linear-gradient(135deg,#0d0d1a,#1a1025)",borderRadius:"14px",padding:"20px",maxWidth:"280px",width:"100%",textAlign:"center",border:`1px solid ${ev.type==="bad"?"#ef4444":"#fbbf24"}18`,animation:"pi .3s ease"}}><div style={{fontSize:"30px",marginBottom:"6px"}}>{ev.type==="bad"?"😰":ev.type==="fame"?"🌟":"🎉"}</div><p style={{color:"#ddd",fontSize:"13px",lineHeight:1.5,margin:"0 0 8px"}}>{ev.text}</p><div style={{fontSize:"11px",fontWeight:700,color:ev.type==="bad"?"#ef4444":"#fbbf24"}}>収入 ×{ev.mult}{ev.fB?` ／ 👑+${ev.fB}`:""}</div><div style={{color:"#333",fontSize:"9px",marginTop:"6px"}}>タップで閉じる</div></div></div>);

// ─── ROULETTE ────────────────────────────────────────────────
const Roulette=({su,onD})=>{const[sp,setSp]=useState(true);const[a,setA]=useState(0);const[r,setR]=useState(null);const fr=useRef(null);
useEffect(()=>{let aa=0,s=20+Math.random()*10;const ok=Math.random()*100>su.risk;const go=()=>{s*=.97;aa+=s;setA(aa%360);if(s>.3){sfx.play("rl");fr.current=requestAnimationFrame(go)}else{setSp(false);setR(ok);sfx.play(ok?"ok":"ng")}};fr.current=requestAnimationFrame(go);return()=>{if(fr.current)cancelAnimationFrame(fr.current)}},[su]);
return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}} onClick={r!==null?()=>onD(r):undefined}><div style={{background:"linear-gradient(135deg,#0d0d1a,#1a1025)",borderRadius:"18px",padding:"24px",maxWidth:"290px",width:"100%",textAlign:"center",border:"1px solid #ffffff0a"}}><div style={{fontSize:"11px",color:"#666",letterSpacing:"2px",marginBottom:"3px"}}>{sp?"施術中...":"結果"}</div><div style={{fontSize:"14px",color:"#fff",fontWeight:700,marginBottom:"12px"}}>{su.emoji} {su.name}</div><div style={{width:"130px",height:"130px",margin:"0 auto 14px",position:"relative",borderRadius:"50%",border:"3px solid #ffffff0a",background:`conic-gradient(#22c55e20 0deg,#22c55e20 ${360-su.risk*3.6}deg,#ef444420 ${360-su.risk*3.6}deg,#ef444420 360deg)`}}><div style={{position:"absolute",top:"-6px",left:"50%",transform:"translateX(-50%)",width:0,height:0,borderLeft:"6px solid transparent",borderRight:"6px solid transparent",borderTop:"9px solid #fbbf24",zIndex:2}}/><div style={{position:"absolute",inset:"9px",borderRadius:"50%",background:"#0d0d1a",display:"flex",alignItems:"center",justifyContent:"center",transform:`rotate(${a}deg)`,transition:sp?"none":"transform .3s ease-out"}}><div style={{position:"absolute",top:"7px",left:"50%",transform:"translateX(-50%)",width:"3px",height:"16px",background:"#fbbf24",borderRadius:"2px"}}/><div style={{fontSize:"24px"}}>{sp?"🔄":r?"✅":"💔"}</div></div></div><div style={{display:"flex",justifyContent:"center",gap:"10px",fontSize:"10px",marginBottom:"8px"}}><span style={{color:"#22c55e"}}>✅{100-su.risk}%</span><span style={{color:"#ef4444"}}>❌{su.risk}%</span></div>{r!==null&&<div style={{animation:"pi .3s ease"}}><div style={{fontSize:"15px",fontWeight:800,color:r?"#22c55e":"#ef4444",marginBottom:"4px"}}>{r?"施術成功！":"施術失敗…"}</div><div style={{fontSize:"10px",color:r?"#22c55e88":"#ef444488"}}>{r?`💎+${su.g} ⭐+${su.i}${su.f?` 👑+${su.f}`:""}`:`効果半減 💎+${Math.floor(su.g*.5)}`}</div><div style={{color:"#333",fontSize:"9px",marginTop:"8px"}}>タップで閉じる</div></div>}</div></div>)};

// ─── CONVO GAME ──────────────────────────────────────────────
const Convo=({stg,earn,glam,onD})=>{const[tm,setTm]=useState(100);const[sel,setSel]=useState(null);
const[ch]=useState(()=>{const p=CONVOS.filter(c=>c.stages.includes(stg));return p[Math.floor(Math.random()*p.length)]||CONVOS[0]});
useEffect(()=>{if(sel!==null)return;const id=setInterval(()=>{setTm(t=>{if(t<=0){clearInterval(id);setSel(-1);return 0}return t-(100/(ch.timer||100)*2)})},100);return()=>clearInterval(id)},[sel,ch.timer]);
const pick=(i)=>{if(sel!==null)return;setSel(i);sfx.play(i===ch.best?"pf":ch.ch[i].s>=1.5?"ok":"wr")};
const res=sel===null?null:sel===-1?{ok:false,pf:false,text:"⏰ 時間切れ",money:0}:{ok:ch.ch[sel].s>=1.5,pf:sel===ch.best,text:sel===ch.best?"✨ PERFECT!":ch.ch[sel].s>=1.5?"⭕ いい判断！":"❌ 微妙…",money:Math.floor(earn*(1+glam/100*2.5)*ch.ch[sel].s*5)};
return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"14px"}}><div style={{background:"linear-gradient(135deg,#0d0d1a,#1a1025)",borderRadius:"16px",padding:"20px",maxWidth:"330px",width:"100%",border:"1px solid #ffffff0a"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}><div><span style={{fontSize:"10px",color:"#fbbf24",letterSpacing:"2px",fontWeight:700}}>🎭 接客チャレンジ</span>{ch.diff==="H"&&<span style={{marginLeft:"5px",fontSize:"8px",color:"#ef4444",background:"#ef444418",padding:"1px 5px",borderRadius:"4px"}}>HARD</span>}{ch.diff==="M"&&<span style={{marginLeft:"5px",fontSize:"8px",color:"#f59e0b",background:"#f59e0b18",padding:"1px 5px",borderRadius:"4px"}}>MEDIUM</span>}</div>{sel===null&&<div style={{width:"45px",height:"4px",background:"#111",borderRadius:"2px",overflow:"hidden"}}><div style={{height:"100%",borderRadius:"2px",transition:"width .1s linear",width:`${Math.max(tm,0)}%`,background:tm>30?"#22c55e":tm>15?"#f59e0b":"#ef4444"}}/></div>}</div>
<p style={{color:"#e2e8f0",fontSize:"13px",lineHeight:1.6,margin:"0 0 12px",fontWeight:600}}>{ch.sit}</p>
<div style={{display:"flex",flexDirection:"column",gap:"5px",marginBottom:"12px"}}>{ch.ch.map((c,i)=>{const show=sel!==null;let bg="rgba(255,255,255,.03)",bc="#ffffff08";if(show&&i===ch.best){bg="#22c55e10";bc="#22c55e33"}if(show&&sel===i&&i!==ch.best&&c.s<1.5){bg="#ef444410";bc="#ef444433"}if(show&&sel===i&&c.s>=1.5&&i!==ch.best){bg="#f59e0b10";bc="#f59e0b33"}return(<button key={i} onClick={()=>pick(i)} disabled={sel!==null} style={{padding:"9px 10px",borderRadius:"8px",border:`1px solid ${bc}`,background:bg,color:show&&i!==sel&&i!==ch.best?"#444":"#ccc",fontSize:"12px",textAlign:"left",cursor:sel===null?"pointer":"default",transition:"all .15s"}}>{c.t}{show&&i===ch.best&&<span style={{float:"right",color:"#22c55e",fontSize:"10px"}}>BEST✓</span>}</button>)})}</div>
{res&&<div style={{textAlign:"center",animation:"pi .3s ease"}}><div style={{fontSize:"16px",fontWeight:800,color:res.pf?"#fbbf24":res.ok?"#22c55e":"#ef4444",marginBottom:"3px"}}>{res.text}</div>{res.money>0&&<div style={{color:"#fbbf24",fontSize:"13px",fontWeight:700}}>+¥{fmt(res.money)}</div>}<button onClick={()=>onD(res)} style={{marginTop:"8px",padding:"7px 20px",borderRadius:"8px",border:"none",background:"linear-gradient(135deg,#fbbf24,#f59e0b)",color:"#000",fontSize:"11px",fontWeight:800,cursor:"pointer"}}>OK</button></div>}</div></div>)};

// ─── STORY ───────────────────────────────────────────────────
const Story=({s,onC})=>{const[ci,setCi]=useState(0);const[dt,setDt]=useState("");const st=s.story||"";
useEffect(()=>{setCi(0);setDt("")},[s]);useEffect(()=>{if(ci<st.length){const t=setTimeout(()=>{setDt(st.slice(0,ci+1));setCi(c=>c+1)},28);return()=>clearTimeout(t)}},[ci,st]);
const skip=()=>{if(ci<st.length){setDt(st);setCi(st.length)}else onC()};
return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.94)",zIndex:1000,display:"flex",flexDirection:"column",justifyContent:"flex-end",padding:"20px"}} onClick={skip}><div style={{textAlign:"center",marginBottom:"auto",paddingTop:"40px",animation:"fi .8s ease"}}><div style={{fontSize:"10px",color:"#555",letterSpacing:"4px",marginBottom:"5px"}}>STAGE {s.id+1}</div><div style={{fontSize:"40px",marginBottom:"4px"}}>{s.emoji}</div><h2 style={{fontSize:"20px",fontWeight:900,color:s.accent,margin:"0 0 2px"}}>{s.name}</h2><div style={{fontSize:"11px",color:"#444"}}>{s.area}</div>{s.rival&&<div style={{marginTop:"10px",display:"inline-flex",alignItems:"center",gap:"4px",padding:"3px 10px",borderRadius:"14px",background:"#ef444410",border:"1px solid #ef444418",fontSize:"10px",color:"#ef4444"}}>{s.rival.emoji} ライバル: {s.rival.name}</div>}</div><div style={{background:"linear-gradient(180deg,#0d0d1aee,#0d0d1a)",borderRadius:"12px",padding:"16px",marginBottom:"14px",border:"1px solid #ffffff06",minHeight:"90px"}}><p style={{color:"#e2e8f0",fontSize:"13px",lineHeight:1.8,margin:0,whiteSpace:"pre-wrap"}}>{dt}{ci<st.length&&<span style={{animation:"bl .8s infinite"}}>▍</span>}</p></div><div style={{textAlign:"center",color:"#333",fontSize:"9px"}}>{ci<st.length?"タップでスキップ":"タップで始める"}</div></div>)};

// ═══════════════════════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════════════════════
function NightQueen(){
  const[money,setMoney]=useState(0);const[glam,setGlam]=useState(0);const[intel,setIntel]=useState(0);const[fame,setFame]=useState(0);
  const[stage,setStage]=useState(0);const[phase,setPhase]=useState("work");const[combo,setCombo]=useState(0);const[mxCombo,setMxC]=useState(0);
  const[tapFx,setTapFx]=useState([]);const[shake,setShake]=useState(false);const[evt,setEvt]=useState(null);const[rou,setRou]=useState(null);
  const[conv,setConv]=useState(false);const[story,setStory]=useState(null);const[muted,setMuted]=useState(false);
  const[taps,setTaps]=useState(0);const[auto,setAuto]=useState(0);const[started,setStarted]=useState(false);const[cleared,setCleared]=useState(false);
  const[doneS,setDoneS]=useState(new Set());const[doneK,setDoneK]=useState(new Set());
  const ct=useRef(null);const ti=useRef(0);const cs=STAGES[stage];const ns=STAGES[stage+1];

  useEffect(()=>{if(auto<=0)return;const id=setInterval(()=>setMoney(m=>m+auto),1000);return()=>clearInterval(id)},[auto]);
  useEffect(()=>{setAuto(Math.floor(cs.earn*.12*(1+glam/100)))},[stage,glam,cs.earn]);
  useEffect(()=>{if(started&&cs.story){setStory(cs);sfx.bgm(stage)}},[stage,started]);

  const start=()=>{sfx.init();sfx.bgm(0);setStarted(true);setStory(STAGES[0])};

  const handleTap=useCallback((e)=>{
    sfx.init();const rect=e.currentTarget.getBoundingClientRect();
    const x=e.clientX??e.touches?.[0]?.clientX??rect.left+rect.width/2;
    const y=e.clientY??e.touches?.[0]?.clientY??rect.top+rect.height/2;
    if(ct.current)clearTimeout(ct.current);const nc=combo+1;setCombo(nc);setMxC(m=>Math.max(m,nc));
    ct.current=setTimeout(()=>setCombo(0),1200);
    if(nc>0&&nc%10===0)sfx.play("combo",{level:Math.floor(nc/10)});else sfx.play("tap",{combo:nc});
    const bM=1+(glam/100)*2.5;const cM=1+Math.min(nc,50)*.02;let earn=Math.floor(cs.earn*bM*cM);
    let ev=null;if(Math.random()<.08){ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];earn=Math.floor(earn*ev.mult);if(ev.fB)setFame(f=>Math.min(f+ev.fB,100));if(ev.type==="bad"){setShake(true);setTimeout(()=>setShake(false),300)}}
    if(!ev&&Math.random()<.04&&taps>3)setConv(true);
    setMoney(m=>m+earn);setTaps(t=>t+1);
    const id=++ti.current;setTapFx(p=>[...p.slice(-8),{x,y,amount:earn,id,combo:nc}]);setTimeout(()=>setTapFx(p=>p.filter(e=>e.id!==id)),900);
    if(ev)setTimeout(()=>setEvt(ev),150);
  },[combo,glam,cs.earn,taps]);

  const doSurg=useCallback((s)=>{if(money<s.cost||doneS.has(s.id))return;sfx.play("buy");setMoney(m=>m-s.cost);setRou(s)},[money,doneS]);
  const onRouD=useCallback((ok)=>{if(!rou)return;const m=ok?1:.5;setGlam(g=>Math.min(g+Math.floor(rou.g*m),100));setIntel(i=>Math.min(i+Math.floor(rou.i*m),100));if(rou.f)setFame(f=>Math.min(f+Math.floor(rou.f*m),100));setDoneS(p=>new Set([...p,rou.id]));setRou(null)},[rou]);
  const doSkill=useCallback((sk)=>{if(money<sk.cost||doneK.has(sk.id))return;sfx.play("buy");setMoney(m=>m-sk.cost);setIntel(i=>Math.min(i+sk.i,100));setFame(f=>Math.min(f+sk.f,100));setDoneK(p=>new Set([...p,sk.id]));sfx.play("coin")},[money,doneK]);
  const onConvD=useCallback((r)=>{if(r.money)setMoney(m=>m+r.money);setConv(false)},[]);
  const canAdv=ns&&glam>=ns.rG&&intel>=ns.rI&&fame>=ns.rF;
  const advance=useCallback(()=>{if(!canAdv)return;sfx.play("up");setStage(s=>s+1);setPhase("work");if(stage+1===STAGES.length-1)setCleared(true)},[canAdv,stage]);
  const toggleM=()=>{const m=sfx.toggle();setMuted(m);if(!m)sfx.bgm(stage)};

  // TITLE
  if(!started)return(
    <div style={{minHeight:"100vh",maxWidth:"430px",margin:"0 auto",background:"linear-gradient(180deg,#080005,#180510 30%,#0a0208 70%,#040002)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif",padding:"40px 20px",position:"relative",overflow:"hidden"}}>
      <style>{`@keyframes tg{0%,100%{text-shadow:0 0 20px #fbbf2433}50%{text-shadow:0 0 40px #fbbf2466,0 0 80px #fbbf2422}}@keyframes fi{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pf{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-10px) translateX(5px)}100%{transform:translateY(0) translateX(0)}}`}</style>
      <Particles color="#fbbf24" type="b"/>
      <div style={{position:"relative",zIndex:1,textAlign:"center"}}>
        <div style={{width:"120px",height:"132px",margin:"0 auto 8px",animation:"fl 3s ease-in-out infinite"}}><Character stageData={STAGES[3]} done={new Set(["s01","s02","s05"])} glamour={50}/></div>
        <h1 style={{fontSize:"30px",fontWeight:900,color:"#fbbf24",margin:"0 0 4px",letterSpacing:"6px",animation:"tg 3s ease infinite"}}>NIGHT QUEEN</h1>
        <p style={{fontSize:"11px",color:"#666",margin:"0 0 32px",letterSpacing:"3px",animation:"fi 1s ease .3s both"}}>夜の道を、極めろ。</p>
        <button onClick={start} style={{padding:"11px 40px",borderRadius:"26px",border:"2px solid #fbbf2440",background:"linear-gradient(135deg,#fbbf2415,#f59e0b0a)",color:"#fbbf24",fontSize:"14px",fontWeight:800,cursor:"pointer",letterSpacing:"4px",animation:"fi 1s ease .6s both",transition:"all .3s"}} onMouseOver={e=>{e.currentTarget.style.boxShadow="0 0 28px #fbbf2433"}} onMouseOut={e=>{e.currentTarget.style.boxShadow="none"}}>START</button>
        <p style={{marginTop:"36px",color:"#2a2a2a",fontSize:"9px",lineHeight:1.8,animation:"fi 1s ease .9s both"}}>場末のスナック → 銀座 → メディア → 政界<br/>12ステージを駆け上がれ<br/><br/>※このゲームはフィクションです</p>
      </div>
    </div>
  );

  // MAIN
  return(
    <div style={{minHeight:"100vh",maxWidth:"430px",margin:"0 auto",background:cs.bg,color:"#fff",fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif",position:"relative",overflow:"hidden",userSelect:"none",WebkitTapHighlightColor:"transparent",transform:shake?`translateX(${Math.random()>.5?3:-3}px)`:"none",transition:shake?"none":"transform .1s"}}>
      <style>{`@keyframes fu{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-65px) scale(1.3)}}@keyframes pi{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes gl{0%,100%{box-shadow:0 0 18px var(--gw)}50%{box-shadow:0 0 40px var(--gw)}}@keyframes pf{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-10px) translateX(5px)}100%{transform:translateY(0) translateX(0)}}@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}@keyframes fi{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}@keyframes cf{0%{color:#fff}50%{color:#fbbf24}100%{color:#fff}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:2px}`}</style>
      <Particles color={cs.ptC} type={cs.ptT}/>

      {/* HEADER */}
      <div style={{padding:"8px 12px 4px",background:"rgba(0,0,0,.55)",backdropFilter:"blur(12px)",position:"sticky",top:0,zIndex:100,borderBottom:"1px solid #ffffff04"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"2px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <div style={{width:"48px",height:"62px",borderRadius:"8px",overflow:"hidden",border:`1px solid ${cs.accent}25`,background:`${cs.accent}06`,flexShrink:0}}>
              <Character stageData={cs} done={doneS} glamour={glam}/>
            </div>
            <div>
              <div style={{fontSize:"8px",color:"#444",letterSpacing:"2px"}}>STAGE {stage+1}/{STAGES.length}</div>
              <div style={{fontSize:"12px",fontWeight:900,color:cs.accent,lineHeight:1.2}}>{cs.name}</div>
              <div style={{fontSize:"8px",color:"#333",marginTop:"1px"}}>{doneS.size+doneK.size}/{SURGERIES.length+SKILLS.length} 完了</div>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <button onClick={toggleM} style={{background:"none",border:"none",color:"#333",fontSize:"12px",cursor:"pointer",padding:"1px"}}>{muted?"🔇":"🔊"}</button>
            <div style={{fontSize:"8px",color:"#555"}}>所持金</div>
            <div style={{fontSize:"15px",fontWeight:900,color:"#fbbf24"}}>¥{fmt(money)}</div>
            {auto>0&&<div style={{fontSize:"7px",color:"#fbbf2444"}}>+¥{fmt(auto)}/s</div>}
          </div>
        </div>
        <SBar l="華" v={glam} max={100} c="#ec4899" e="💎" r={ns?.rG}/>
        <SBar l="知性" v={intel} max={100} c="#8b5cf6" e="⭐" r={ns?.rI}/>
        <SBar l="影響力" v={fame} max={100} c="#fbbf24" e="👑" r={ns?.rF}/>
      </div>

      {/* TABS */}
      <div style={{display:"flex",padding:"4px 12px",gap:"4px",background:"rgba(0,0,0,.35)",backdropFilter:"blur(8px)",position:"sticky",top:"132px",zIndex:99}}>
        {[{id:"work",l:cs.tap,e:cs.emoji},{id:"clinic",l:`整形 ${doneS.size}/${SURGERIES.length}`,e:"🏥"},{id:"skills",l:`スキル ${doneK.size}/${SKILLS.length}`,e:"📖"}].map(tab=>(
          <button key={tab.id} onClick={()=>setPhase(tab.id)} style={{flex:1,padding:"7px 3px",borderRadius:"6px",border:"none",background:phase===tab.id?`${cs.accent}15`:"rgba(255,255,255,.01)",color:phase===tab.id?cs.accent:"#3a3a3a",fontSize:"10px",fontWeight:phase===tab.id?800:400,cursor:"pointer",transition:"all .2s",borderBottom:phase===tab.id?`2px solid ${cs.accent}`:"2px solid transparent"}}>{tab.e} {tab.l}</button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{padding:"8px 12px 120px",minHeight:"50vh",position:"relative",zIndex:1}}>

        {phase==="work"&&<div>
          {combo>2&&<div style={{textAlign:"center",marginBottom:"5px",animation:"pi .2s ease"}}><span style={{display:"inline-block",padding:"2px 10px",borderRadius:"14px",background:combo>=20?"#fbbf2418":"#ffffff05",border:`1px solid ${combo>=20?"#fbbf2428":"#ffffff08"}`,fontSize:"11px",fontWeight:900,color:combo>=30?"#fbbf24":combo>=20?"#f59e0b":combo>=10?"#ec4899":"#666",animation:combo>=10?"cf .5s ease infinite":"none"}}>🔥 {combo} COMBO{combo>=10?` ×${(1+Math.min(combo,50)*.02).toFixed(2)}`:""}</span></div>}

            <p style={{color:"#444",fontSize:"9px",margin:"0 0 6px"}}>{cs.area}</p>
            {/* Large character */}

              style={{width:"140px",height:"140px",borderRadius:"50%",background:`radial-gradient(circle at 40% 40%,${cs.accent}15,transparent 70%)`,border:`2px solid ${cs.accent}22`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"transform .1s","--gw":`${cs.accent}22`,animation:"gl 2.5s ease infinite"}}>
              <div style={{fontSize:"32px",marginBottom:"3px",filter:`drop-shadow(0 0 5px ${cs.accent}28)`}}>{cs.emoji}</div>
              <div style={{color:cs.accent,fontSize:"11px",fontWeight:800}}>{cs.tap}</div>
              <div style={{color:"#333",fontSize:"8px",marginTop:"2px"}}>¥{fmt(Math.floor(cs.earn*(1+glam/100*2.5)))}/tap</div>
            </div>
          </div>

          <div style={{textAlign:"center",color:"#222",fontSize:"8px",marginBottom:"14px"}}>tap {taps.toLocaleString()} ／ max combo {mxCombo}</div>

          {ns&&<div style={{padding:"10px",borderRadius:"10px",background:"rgba(0,0,0,.3)",border:"1px solid #ffffff04"}}>
            <div style={{fontSize:"9px",color:"#444",letterSpacing:"1px",marginBottom:"4px"}}>NEXT → {ns.emoji} {ns.name}</div>
            <div style={{display:"flex",gap:"4px",flexWrap:"wrap",marginBottom:"7px"}}>
              {[{l:"💎",v:glam,r:ns.rG},{l:"⭐",v:intel,r:ns.rI},{l:"👑",v:fame,r:ns.rF}].map((x,i)=><span key={i} style={{padding:"1px 6px",borderRadius:"4px",fontSize:"9px",fontWeight:700,background:x.v>=x.r?"#22c55e10":"#ef444410",color:x.v>=x.r?"#22c55e":"#ef4444"}}>{x.l}{x.v}/{x.r}</span>)}
            </div>
            <button onClick={advance} disabled={!canAdv} style={{width:"100%",padding:"9px",borderRadius:"8px",border:"none",background:canAdv?`linear-gradient(135deg,${cs.accent},${cs.accent}bb)`:"#0a0a10",color:canAdv?"#fff":"#222",fontSize:"11px",fontWeight:800,cursor:canAdv?"pointer":"default",transition:"all .3s",boxShadow:canAdv?`0 4px 18px ${cs.accent}28`:"none",letterSpacing:canAdv?"2px":"0"}}>{canAdv?"🚀 ステージアップ":"🔒 条件未達成"}</button>
          </div>}

          {cleared&&!ns&&<div style={{marginTop:"12px",padding:"20px",borderRadius:"14px",textAlign:"center",background:"linear-gradient(135deg,#1a080028,#2a120428)",border:"2px solid #fbbf2428","--gw":"#fbbf2428",animation:"gl 2s ease infinite"}}>
            <div style={{fontSize:"44px",marginBottom:"4px",animation:"pu 1.5s ease infinite"}}>👑</div>
            <h2 style={{color:"#fbbf24",fontSize:"18px",fontWeight:900,margin:"0 0 5px",letterSpacing:"4px"}}>GAME CLEAR</h2>
            <p style={{color:"#888",fontSize:"11px",margin:0,lineHeight:1.8}}>あなたは夜の道を極め、<br/>この国の頂点に立った。<br/><span style={{color:"#fbbf24"}}>NIGHT QUEEN</span> の称号を手にした。</p>
          </div>}
        </div>}

        {phase==="clinic"&&<div>
          <div style={{textAlign:"center",marginBottom:"8px"}}>
            <h2 style={{fontSize:"13px",fontWeight:800,color:"#ec4899",margin:"0 0 2px"}}>🏥 美容クリニック</h2>
            <p style={{color:"#333",fontSize:"9px",margin:0}}>各施術は1回のみ ／ ルーレットで運命が決まる</p>
          </div>
          <div style={{width:"90px",height:"117px",margin:"0 auto 10px",border:`1px solid ${cs.accent}18`,borderRadius:"8px",background:`${cs.accent}04`,overflow:"hidden"}}>
            <Character stageData={cs} done={doneS} glamour={glam}/>
          </div>
          {[1,2,3,4].map(tier=>{const items=SURGERIES.filter(s=>s.tier===tier);const allD=items.every(s=>doneS.has(s.id));return(
            <div key={tier} style={{marginBottom:"10px"}}>
              <div style={{fontSize:"9px",color:"#444",letterSpacing:"1px",marginBottom:"4px",padding:"2px 0",borderBottom:"1px solid #ffffff04",display:"flex",justifyContent:"space-between"}}>
                <span>{["💉 入門","🔪 中級","🏥 上級","💎 プレミアム"][tier-1]}</span>{allD&&<span style={{color:"#22c55e"}}>✓COMPLETE</span>}
              </div>
              {items.map(s=>{const d=doneS.has(s.id);const ok=money>=s.cost&&!d;return(

                  <div style={{fontSize:"18px",width:"26px",textAlign:"center"}}>{d?"✅":s.emoji}</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <span style={{color:d?"#22c55e":"#bbb",fontSize:"11px",fontWeight:700,textDecoration:d?"line-through":"none"}}>{s.name}</span>
                      {!d&&<span style={{color:"#fbbf24",fontSize:"9px",fontWeight:700}}>¥{fmt(s.cost)}</span>}
                      {d&&<span style={{color:"#22c55e",fontSize:"8px"}}>済</span>}
                    </div>
                    {!d&&<div style={{display:"flex",gap:"4px",marginTop:"2px",fontSize:"8px"}}>
                      <span style={{color:"#ec4899"}}>💎+{s.g}</span><span style={{color:"#8b5cf6"}}>⭐+{s.i}</span>{s.f>0&&<span style={{color:"#fbbf24"}}>👑+{s.f}</span>}<span style={{color:s.risk>10?"#ef4444":"#f59e0b"}}>⚠️{s.risk}%</span>
                    </div>}
                  </div>
                </button>
              )})}
            </div>
          )})}
          {doneS.size===SURGERIES.length&&<div style={{textAlign:"center",padding:"12px",borderRadius:"8px",background:"#22c55e06",border:"1px solid #22c55e18"}}><div style={{fontSize:"12px",fontWeight:800,color:"#22c55e"}}>🎉 全施術コンプリート！</div></div>}
        </div>}

        {phase==="skills"&&<div>
          <div style={{textAlign:"center",marginBottom:"8px"}}>
            <h2 style={{fontSize:"13px",fontWeight:800,color:"#8b5cf6",margin:"0 0 2px"}}>📖 スキルアップ</h2>
            <p style={{color:"#333",fontSize:"9px",margin:0}}>各スキル1回のみ ／ 知性と影響力を高めよう</p>
          </div>
          {SKILLS.map(sk=>{const d=doneK.has(sk.id);const ok=money>=sk.cost&&!d;return(
            <button key={sk.id} onClick={()=>ok&&doSkill(sk)} style={{width:"100%",padding:"8px 9px",marginBottom:"3px",borderRadius:"7px",border:`1px solid ${d?"#22c55e10":"#ffffff04"}`,background:d?"#22c55e06":ok?"rgba(255,255,255,.02)":"rgba(0,0,0,.18)",opacity:d?.45:ok?1:.3,cursor:ok?"pointer":"default",display:"flex",alignItems:"center",gap:"7px",textAlign:"left",transition:"all .15s"}}>
              <div style={{fontSize:"18px",width:"26px",textAlign:"center"}}>{d?"✅":sk.emoji}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:d?"#22c55e":"#bbb",fontSize:"11px",fontWeight:700,textDecoration:d?"line-through":"none"}}>{sk.name}</span>
                  {!d&&<span style={{color:"#fbbf24",fontSize:"9px",fontWeight:700}}>¥{fmt(sk.cost)}</span>}
                  {d&&<span style={{color:"#22c55e",fontSize:"8px"}}>済</span>}
                </div>
                {!d&&<div style={{display:"flex",gap:"4px",marginTop:"2px",fontSize:"8px"}}>
                  <span style={{color:"#8b5cf6"}}>⭐+{sk.i}</span><span style={{color:"#fbbf24"}}>👑+{sk.f}</span>
                </div>}
              </div>
            </button>
          )})}
          {doneK.size===SKILLS.length&&<div style={{textAlign:"center",padding:"12px",borderRadius:"8px",background:"#22c55e06",border:"1px solid #22c55e18"}}><div style={{fontSize:"12px",fontWeight:800,color:"#22c55e"}}>🎉 全スキルコンプリート！</div></div>}
        </div>}
      </div>

      {tapFx.map(e=><div key={e.id} style={{position:"fixed",left:e.x-25,top:e.y-16,pointerEvents:"none",color:e.combo>=20?"#fbbf24":e.combo>=10?"#ec4899":"#fff",fontSize:e.combo>=10?"16px":"14px",fontWeight:900,textShadow:`0 0 6px ${cs.accent}55`,animation:"fu .9s ease-out forwards",zIndex:9999}}>+¥{fmt(e.amount)}</div>)}
      {story&&<Story s={story} onC={()=>setStory(null)}/>}
      {evt&&<EvtPop ev={evt} onC={()=>setEvt(null)}/>}
      {rou&&<Roulette su={rou} onD={onRouD}/>}
      {conv&&<Convo stg={stage} earn={cs.earn} glam={glam} onD={onConvD}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<NightQueen/>);
</script>
</body>
</html>
